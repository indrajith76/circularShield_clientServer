<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" fill="none">
  <!-- White version for dark backgrounds (#102C3A) -->
  <defs>
    <linearGradient id="shieldGradW" x1="50" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E75FF" />
      <stop offset="100%" stopColor="#0B2038" />
    </linearGradient>

    <linearGradient id="shieldFacetW" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2E86FF" />
      <stop offset="60%" stopColor="#154A82" />
      <stop offset="100%" stopColor="#0E335C" />
    </linearGradient>

    <linearGradient id="swooshGradW" x1="10" y1="60" x2="90" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00E5C9" />
      <stop offset="50%" stopColor="#087F70" />
      <stop offset="100%" stopColor="#00BFA5" />
    </linearGradient>

    <linearGradient id="checkCircleGradW" x1="68" y1="48" x2="82" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00E5C9" />
      <stop offset="100%" stopColor="#087F70" />
    </linearGradient>
  </defs>

  <!-- Left Icon -->
  <g transform="translate(6, 4) scale(0.46)">
    <!-- Outer Shield with crisp bright outline -->
    <path d="M100 22 C138 35 158 46 166 68 C166 112 144 148 100 172 C56 148 34 112 34 68 C42 46 62 35 100 22 Z" fill="url(#shieldGradW)" stroke="#388BFD" stroke-width="2" stroke-opacity="0.6" />

    <!-- Shield Inner Highlight -->
    <path d="M100 28 C134 40 151 50 159 69 C159 108 139 141 100 163 C61 141 41 108 41 69 C49 50 66 40 100 28 Z" fill="url(#shieldFacetW)" stroke="#58A6FF" stroke-width="2" stroke-opacity="0.4" />

    <!-- Document -->
    <g>
      <path d="M68 52 C68 47.5 71.5 44 76 44 H114 L132 62 V128 C132 132.5 128.5 136 124 136 H76 C71.5 136 68 132.5 68 128 Z" fill="#FFFFFF" />
      <path d="M114 44 V58 C114 60.2 115.8 62 118 62 H132 Z" fill="#D3E2F2" />
      <text x="100" y="78" fill="#102C3A" font-family="'Inter', sans-serif" font-weight="800" font-size="16" letter-spacing="1" text-anchor="middle">JOB</text>
      <rect x="80" y="88" width="40" height="4.5" rx="2.25" fill="#8FA4BD" />
      <rect x="80" y="98" width="40" height="4.5" rx="2.25" fill="#8FA4BD" />
      <rect x="80" y="108" width="28" height="4.5" rx="2.25" fill="#B0C1D4" />
    </g>

    <!-- Swoosh -->
    <path d="M22 118 C28 140 70 148 108 138 C144 128 166 108 172 82 C174 74 168 68 160 70 C154 72 148 76 142 82 C126 98 94 114 64 120 C46 124 32 122 22 118 Z" fill="url(#swooshGradW)" />

    <!-- Badge -->
    <g transform="translate(142, 114)">
      <circle cx="0" cy="0" r="23" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="19.5" fill="url(#checkCircleGradW)" />
      <path d="M-8 -1 L-2.5 5 L8 -7" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Typography: White Text for Dark Background -->
  <g transform="translate(108, 52)">
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Circular</tspan>
      <tspan fill="#00E5C9">Shield</tspan>
    </text>
  </g>

  <!-- Tagline underneath text (slate-300 on dark) -->
  <g transform="translate(110, 78)">
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="1.2">
      Verify <tspan fill="#00E5C9">•</tspan> Detect <tspan fill="#00E5C9">•</tspan> Stay Safe
    </text>
  </g>
</svg>
